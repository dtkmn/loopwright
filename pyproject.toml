[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopwright"
version = "0.1.0"
description = "Flight recorder for inspecting, verifying, and replaying AI agent loops."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
keywords = ["ai", "agents", "loop-engineering", "rag", "ollama", "fastapi"]
dependencies = [
  "aiohttp>=3.14.3",
  "charset-normalizer>=3.4.4",
  "docx2txt>=0.9",
  "faiss-cpu>=1.13.2",
  "fastapi>=0.138.0",
  "langchain>=1.3.10",
  "langchain-core>=1.4.8",
  "langgraph-checkpoint>=4.1.1",
  "langchain-text-splitters>=1.1.2",
  "langsmith>=0.8.18",
  "marshmallow>=3.26.2",
  "numpy>=2.3.4",
  "orjson>=3.11.7",
  "pillow>=12.2.0",
  "pydantic>=2.11.10",
  "pypdf>=6.13.3",
  "python-multipart>=0.0.32",
  "urllib3>=2.7.0",
  "uvicorn>=0.38.0",
]

[project.urls]
Repository = "https://github.com/dtkmn/loopwright"
Issues = "https://github.com/dtkmn/loopwright/issues"

[project.scripts]
loopwright = "src.app:main"
ai-loop-engine = "src.app:main"
loopwright-eval = "src.loop_eval:main"
ai-loop-eval = "src.loop_eval:main"
loopwright-ollama-eval = "src.ollama_model_eval:main"
ai-loop-ollama-eval = "src.ollama_model_eval:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pip-audit>=2.10.1",
  "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
