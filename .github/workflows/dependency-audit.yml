name: Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - requirements*.txt
      - pyproject.toml
      - uv.lock
      - setup.cfg
      - setup.py
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            uv.lock

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit uv

      - name: Export locked third-party dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project --no-hashes
          --output-file /tmp/loopwright-audit-requirements.txt

      - name: Run vulnerability audit
        run: pip-audit -r /tmp/loopwright-audit-requirements.txt --strict
